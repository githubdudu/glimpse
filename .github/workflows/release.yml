name: "publish"

on:
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-release:
    permissions:
      contents: write

    runs-on: ubuntu-24.04

    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.release-type.outputs.version }}
      prerelease: ${{ steps.release-type.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v5

      - name: determine release type
        id: release-type
        shell: bash
        run: |
          VERSION=$(awk -F'"' '
            /^\[package\]$/ { in_package = 1; next }
            /^\[/ { in_package = 0 }
            in_package && /^version = / { print $2; exit }
          ' src-tauri/Cargo.toml)
          if [[ -z "$VERSION" ]]; then
            echo "Failed to resolve app version from src-tauri/Cargo.toml" >&2
            exit 1
          fi
          PKG_VERSION=$(jq -r .version package.json)
          if [[ "$PKG_VERSION" != "$VERSION" ]]; then
            echo "Version mismatch: src-tauri/Cargo.toml=$VERSION package.json=$PKG_VERSION" >&2
            exit 1
          fi
          if [[ "$VERSION" =~ -rc\.[0-9]+$ ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: create draft release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `v${{ steps.release-type.outputs.version }}`;
            const release = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Glimpse ${tag}`,
              body: "See the assets to download this version and install.",
              draft: true,
              prerelease: ${{ steps.release-type.outputs.prerelease }},
            };

            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                owner: release.owner,
                repo: release.repo,
                tag,
              });
              return data.id;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const { data } = await github.rest.repos.createRelease(release);
            return data.id;

  publish-tauri:
    permissions:
      contents: write
    needs: create-release

    strategy:
      fail-fast: false
      matrix:
        include:
              - platform: windows-2022
                os: windows
                rust-targets: x86_64-pc-windows-msvc
                tauri-args: ""
                cargo-cache-dir: C:\t

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4


      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: install LLVM
        if: matrix.os == 'windows'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20.1.8"
          directory: ${{ runner.temp }}/llvm

      - name: configure Windows build paths
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $cargoTargetDir = "C:\t"
          $libclangPath = Join-Path $env:RUNNER_TEMP "llvm\bin"
          New-Item -ItemType Directory -Force $cargoTargetDir | Out-Null
          "CARGO_TARGET_DIR=$cargoTargetDir" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=$libclangPath" >> $env:GITHUB_ENV

      - name: install Vulkan SDK
        if: matrix.os == 'windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: cache bun
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/bun
            ~/Library/Caches/bun
            ~\AppData\Local\bun\install\cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: cache rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}
          workspaces: src-tauri -> target
          cache-directories: ${{ matrix.cargo-cache-dir }}
          cache-on-failure: true

      - name: install frontend dependencies
        run: bun ci



      # macOS build removed — this workflow now only builds Windows (matrix includes windows-2022 only)

      - name: build and publish Windows
        if: matrix.os == 'windows'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Disable signing for CI Windows builds — use unsigned artifacts.
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          VITE_GLIMPSE_PERSONAL_CHECKOUT_URL: ${{ secrets.VITE_GLIMPSE_PERSONAL_CHECKOUT_URL }}
          VITE_GLIMPSE_COMMERCIAL_CHECKOUT_URL: ${{ secrets.VITE_GLIMPSE_COMMERCIAL_CHECKOUT_URL }}
          VITE_GLIMPSE_FOUNDER_CHECKOUT_URL: ${{ secrets.VITE_GLIMPSE_FOUNDER_CHECKOUT_URL }}
          VITE_GLIMPSE_CUSTOMER_PORTAL: ${{ secrets.VITE_GLIMPSE_CUSTOMER_PORTAL }}
          GLIMPSE_POLAR_BENEFIT_PERSONAL: ${{ secrets.GLIMPSE_POLAR_BENEFIT_PERSONAL }}
          GLIMPSE_POLAR_BENEFIT_COMMERCIAL: ${{ secrets.GLIMPSE_POLAR_BENEFIT_COMMERCIAL }}
          GLIMPSE_POLAR_BENEFIT_FOUNDER: ${{ secrets.GLIMPSE_POLAR_BENEFIT_FOUNDER }}
          GLIMPSE_POLAR_BENEFIT_CONTRIBUTOR: ${{ secrets.GLIMPSE_POLAR_BENEFIT_CONTRIBUTOR }}
        with:
          releaseId: ${{ needs.create-release.outputs.release-id }}
          tagName: v__VERSION__
          releaseName: "Glimpse v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: ${{ needs.create-release.outputs.prerelease == 'true' }}
          includeUpdaterJson: false
          args: ${{ matrix.tauri-args }}

  # publish-updater-json job removed — updater metadata upload disabled
